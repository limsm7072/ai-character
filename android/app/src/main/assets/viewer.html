<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>3D Viewer</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
  model-viewer {
    width: 100%;
    height: 100%;
    --poster-color: transparent;
  }
  model-viewer::part(default-progress-bar) {
    background: #009688;
    height: 3px;
  }
</style>
</head>
<body>
<model-viewer
  id="mv"
  auto-rotate
  camera-controls
  touch-action="pan-y"
  interaction-prompt="none"
  shadow-intensity="0.5"
  environment-image="neutral"
  exposure="1.2"
  style="background-color: #1a1a2e;"
></model-viewer>
<script>
  const mv = document.getElementById('mv');
  // Read model path from URL hash: viewer.html#src=models/Fox.glb
  const params = new URLSearchParams(window.location.hash.substring(1));
  const src = params.get('src');
  if (src) {
    mv.setAttribute('src', src);
  }
  // Enable animation if model has any
  mv.addEventListener('load', () => {
    if (mv.availableAnimations && mv.availableAnimations.length > 0) {
      mv.setAttribute('animation-name', mv.availableAnimations[0]);
      mv.setAttribute('autoplay', '');
    }
    // Notify Flutter that loading is done
    if (window.ModelViewerChannel) {
      window.ModelViewerChannel.postMessage('loaded');
    }
  });
</script>
</body>
</html>
